<!doctype html>
<html lang="en">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>AI Limits</title>
  <style>
    * {
      box-sizing: border-box
    }

    html {
      color-scheme: light
    }

    body {
      margin: 0;
      background: #faf9f6;
      color: #202020;
      font: 15px/1.55 -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      -webkit-font-smoothing: antialiased
    }

    main {
      max-width: 440px;
      margin: 0 auto;
      padding: 40px 24px 28px
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 44px
    }

    .mark {
      display: grid;
      place-items: center;
      background: #202020;
      color: #fff;
      width: 32px;
      height: 32px;
      border-radius: 8px;
      font: 700 16px ui-monospace, Menlo, monospace
    }

    .wordmark {
      font-size: 20px;
      font-weight: 600;
      letter-spacing: -.6px
    }

    .eyebrow {
      font: 11px ui-monospace, Menlo, monospace;
      letter-spacing: 1.1px;
      text-transform: uppercase;
      color: #777;
      margin-bottom: 10px
    }

    h1 {
      font-size: 32px;
      line-height: 1.15;
      letter-spacing: -1.3px;
      font-weight: 600;
      margin: 0 0 12px
    }

    p {
      margin: 0 0 24px;
      color: #737373
    }

    .panel {
      margin: 28px 0 24px;
      padding: 18px 0;
      border-top: 1px solid #e5e3df;
      border-bottom: 1px solid #e5e3df;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px
    }

    .label {
      font-size: 14px;
      font-weight: 500
    }

    .badge {
      display: flex;
      align-items: center;
      gap: 6px;
      font-size: 12px;
      color: #666
    }

    .dot {
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: #202020
    }

    .dot.empty {
      background: #b8b6b1
    }

    button,
    .button {
      display: flex;
      align-items: center;
      justify-content: center;
      width: 100%;
      min-height: 48px;
      padding: 12px 18px;
      border: 1px solid #202020;
      border-radius: 24px;
      background: #202020;
      color: white;
      font: 500 14px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      text-decoration: none;
      cursor: pointer;
      transition: background .15s
    }

    button:hover,
    .button:hover {
      background: #383838
    }

    button.secondary,
    .button.secondary {
      background: transparent;
      color: #202020;
      border-color: #d8d6d1;
      margin-top: 10px
    }

    button.secondary:hover,
    .button.secondary:hover {
      background: #efede8
    }

    button.quiet {
      background: transparent;
      color: #737373;
      border: 0;
      margin-top: 14px;
      min-height: 40px
    }

    button:focus-visible,
    a:focus-visible {
      outline: 2px solid #202020;
      outline-offset: 4px
    }

    .note {
      font-size: 12px;
      line-height: 1.6;
      margin: 20px 0 0;
      color: #85837e
    }

    .footer {
      margin-top: 48px;
      padding-top: 16px;
      border-top: 1px solid #e5e3df;
      font: 11px ui-monospace, Menlo, monospace;
      color: #96938c
    }

    .code-box {
      background: #eeede9;
      border: 1px solid #e4e2dc;
      border-radius: 12px;
      padding: 22px 12px;
      text-align: center;
      margin: 24px 0;
      display: block;
      color: #202020;
      cursor: pointer
    }

    .code-box:hover {
      background: #e7e5df
    }

    .copy-control {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      background: #faf9f6;
      border: 1px solid #d8d6d1;
      border-radius: 18px;
      padding: 6px 14px;
      margin-top: 12px;
      font-size: 12px;
      letter-spacing: 0;
      color: #202020
    }

    .code-label {
      font: 10px ui-monospace, Menlo, monospace;
      text-transform: uppercase;
      letter-spacing: 1px;
      color: #85837e
    }

    code {
      display: block;
      font: 500 30px/1.6 ui-monospace, Menlo, monospace;
      letter-spacing: 2px;
      color: #202020;
      overflow-wrap: anywhere;
      -webkit-user-select: all;
      user-select: all
    }

    .account-group {
      border-top: 1px solid #e5e3df;
      padding: 16px 0;
      margin: 0
    }

    .account-group summary {
      display: list-item;
      color: #202020;
      font-weight: 500
    }

    .account-group .providers {
      margin-top: 14px
    }

    .count {
      float: right;
      color: #85837e;
      font: 12px ui-monospace, Menlo, monospace
    }

    .account-caption {
      color: #202020;
      font-size: 13px;
      margin: 0 0 22px
    }

    .providers {
      display: grid;
      gap: 8px
    }

    .provider-card {
      background: transparent;
      color: #202020;
      border: 1px solid #e5e3df;
      border-radius: 12px;
      justify-content: space-between;
      text-align: left;
      gap: 8px
    }

    .provider-card:hover,
    .provider-card.selected {
      background: #eeede9;
      border-color: #b8b6b1
    }

    label {
      display: block;
      font-size: 13px;
      margin: 18px 0 6px
    }

    input,
    textarea {
      width: 100%;
      padding: 12px;
      background: #fff;
      border: 1px solid #d8d6d1;
      border-radius: 8px;
      font: 14px ui-monospace, Menlo, monospace;
      color: #202020
    }

    details {
      margin: 18px 0
    }

    summary {
      color: #737373;
      font-size: 13px;
      cursor: pointer
    }

    form button {
      margin-top: 20px
    }

    #error {
      color: #b42318
    }

    .steps {
      margin: 24px 0;
      padding-left: 20px;
      color: #737373;
      font-size: 14px
    }

    .steps li {
      padding-left: 4px;
      margin-bottom: 12px
    }

    .steps strong {
      color: #202020;
      font-weight: 500
    }

    @media(max-width:340px) {
      main {
        padding: 28px 18px
      }

      .brand {
        margin-bottom: 32px
      }

      h1 {
        font-size: 28px
      }

      code {
        font-size: 25px
      }
    }
  </style>
</head>

<body>
  <main>
    <header class="brand"><span class="mark" aria-hidden="true">&gt;_</span><span class="wordmark">ai limits</span>
    </header>
    <div class="eyebrow">Account profile</div>
    <h1>Add Codex.</h1>
    <p>Give this account a short name to identify it on your watch.</p>
    <form id="name-form"><label for="label">Account name</label><input id="label" required maxlength="16"
        autocomplete="off" placeholder="Personal or Work" value="">
      <p id="error" role="alert"></p><button>Add and connect</button>
    </form><button class="quiet" onclick="closePage({&quot;action&quot;:&quot;back&quot;})">Back</button>
    <footer class="footer">AI LIMITS / PEBBLE</footer>
  </main>
  <script>function closePage(data) { location.href = "pebblejs://close#" + encodeURIComponent(JSON.stringify(data)); } document.getElementById("name-form").onsubmit = function (e) { e.preventDefault(); var label = document.getElementById("label").value.trim(); if (!label) { document.getElementById("error").textContent = "Enter an account name."; return; } closePage({ "action": "createAccount", "provider": "codex", label: label }); };</script>
</body>

</html>
