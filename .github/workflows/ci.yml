name: CI

on:
  push:
    branches:
      - main
  pull_request:

env:
  PEBBLE_SDK_VERSION: 4.33.1

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: |
            requirements-dev.txt
            .github/workflows/ci.yml

      - name: Install JavaScript dependencies
        run: npm ci

      - name: Install check tools
        run: |
          python -m venv .venv
          .venv/bin/python -m pip install -r requirements-dev.txt

      - name: Run checks
        run: npm run check

  build:
    runs-on: ubuntu-24.04
    outputs:
      release_version: ${{ steps.release_version.outputs.version }}
    steps:
      - name: Check out source
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: |
            requirements-dev.txt
            .github/workflows/ci.yml

      - name: Install Pebble SDK system libraries
        run: |
          sudo apt-get update
          sudo apt-get install --yes libsdl2-2.0-0 libglib2.0-0 libpixman-1-0 zlib1g libsndio7.0

      - name: Cache Pebble SDK
        uses: actions/cache@v4
        with:
          path: ~/.local/share/pebble-sdk
          key: ${{ runner.os }}-${{ runner.arch }}-pebble-sdk-${{ env.PEBBLE_SDK_VERSION }}

      - name: Install Pebble build tools
        run: |
          python -m venv .venv
          .venv/bin/python -m pip install --upgrade pip
          .venv/bin/python -m pip install -r requirements-dev.txt pebble-tool==5.0.40
          .venv/bin/pebble sdk install "$PEBBLE_SDK_VERSION"

      - name: Set automatic release version
        id: release_version
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          VERSION_PREFIX="$(node -p "require('./package.json').version" | sed 's/\.[^.]*$//')"
          RELEASE_VERSION="$VERSION_PREFIX.$(git rev-list --count "$GITHUB_SHA")"
          echo "version=$RELEASE_VERSION" >> "$GITHUB_OUTPUT"
          npm version "$RELEASE_VERSION" --no-git-tag-version --allow-same-version

      - name: Build Pebble app
        run: .venv/bin/pebble build

      - name: Upload Pebble build outputs
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@v4
        with:
          name: pebble-build
          path: |
            build/pebble-codex-usage.pbw
            build/pebble-js-app.js.map

  package:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs:
      - test
      - build
    runs-on: ubuntu-24.04
    outputs:
      release_version: ${{ needs.build.outputs.release_version }}
    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.13'

      - name: Download Pebble build outputs
        uses: actions/download-artifact@v4
        with:
          name: pebble-build
          path: build

      - name: Package release artifacts
        env:
          RELEASE_VERSION: ${{ needs.build.outputs.release_version }}
        run: |
          mkdir -p dist
          python tools/package-release.py build/pebble-codex-usage.pbw dist/codex-limits.pbw
          cp build/pebble-js-app.js.map dist/codex-limits.js.map
          cp dist/codex-limits.pbw "dist/ai-limits-$RELEASE_VERSION.pbw"
          cp dist/codex-limits.js.map "dist/ai-limits-$RELEASE_VERSION.js.map"
          sha256sum "dist/ai-limits-$RELEASE_VERSION.pbw" "dist/ai-limits-$RELEASE_VERSION.js.map" > "dist/ai-limits-$RELEASE_VERSION.sha256"

      - name: Upload release artifacts
        uses: actions/upload-artifact@v4
        with:
          name: release-artifacts
          path: dist/ai-limits-*

  release:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: package
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - name: Download release artifacts
        uses: actions/download-artifact@v4
        with:
          name: release-artifacts
          path: dist

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.package.outputs.release_version }}
        run: |
          if gh release view "v$VERSION" >/dev/null 2>&1; then
            echo "Release v$VERSION already exists; skipping duplicate publication."
            exit 0
          fi

          gh release create "v$VERSION" \
            "dist/ai-limits-$VERSION.pbw" \
            "dist/ai-limits-$VERSION.js.map" \
            "dist/ai-limits-$VERSION.sha256" \
            --title "AI Limits $VERSION" \
            --generate-notes \
            --target "$GITHUB_SHA"
