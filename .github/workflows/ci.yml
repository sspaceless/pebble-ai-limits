name: CI and Release

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

jobs:
  changes:
    name: Detect app build changes
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      pull-requests: read
    outputs:
      app: ${{ steps.filter.outputs.app }}
    steps:
      - name: Check out source
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Filter app build inputs
        uses: dorny/paths-filter@v4
        id: filter
        with:
          base: ${{ github.ref }}
          predicate-quantifier: 'some-with-excludes'
          filters: |
            app:
              - 'src/**'
              - 'wscript'
              - 'package.json'
              - 'package-lock.json'
              - 'tools/package-release.py'
              - '.github/workflows/**'
              - '!**/*.md'

  checks:
    uses: ./.github/workflows/checks.yml

  pebble_build:
    needs: changes
    if: needs.changes.outputs.app == 'true'
    uses: ./.github/workflows/pebble-build.yml
    with:
      publish_release: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}

  package_release:
    name: Package and publish release
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs:
      - changes
      - checks
      - pebble_build
    uses: ./.github/workflows/release.yml
    permissions:
      contents: write
