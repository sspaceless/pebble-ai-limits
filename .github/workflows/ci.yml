name: CI and Release

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

jobs:
  checks:
    uses: ./.github/workflows/checks.yml

  pebble_build:
    uses: ./.github/workflows/pebble-build.yml
    with:
      publish_release: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}

  package_release:
    name: Package and publish release
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs:
      - checks
      - pebble_build
    uses: ./.github/workflows/release.yml
    permissions:
      contents: write
