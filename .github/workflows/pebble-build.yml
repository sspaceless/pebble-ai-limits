name: Pebble build

on:
  workflow_call:
    inputs:
      publish_release:
        description: Whether to prepare a versioned build artifact for a main branch release.
        required: true
        type: boolean

permissions:
  contents: read

env:
  PEBBLE_SDK_VERSION: 4.33.1

jobs:
  pebble_build:
    name: Build Pebble app (7 platforms)
    runs-on: ubuntu-24.04
    steps:
      - name: Check out source
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Set up Python
        id: setup_python
        uses: actions/setup-python@v7
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: .github/workflows/pebble-build.yml

      - name: Cache Pebble build environment
        uses: actions/cache@v5
        with:
          path: .venv
          key: ${{ runner.os }}-${{ runner.arch }}-pebble-build-venv-${{ steps.setup_python.outputs.python-version }}-${{ hashFiles('.github/workflows/pebble-build.yml') }}

      - name: Install Pebble SDK system libraries
        run: |
          required_packages=(libsdl2-2.0-0 libglib2.0-0 libpixman-1-0 zlib1g libsndio7.0)
          missing_packages=()
          for package_name in "${required_packages[@]}"; do
            package_status="$(dpkg-query -W -f='${Status}' "$package_name" 2>/dev/null || true)"
            if [ "$package_status" != "install ok installed" ]; then
              missing_packages+=("$package_name")
            fi
          done

          if [ "${#missing_packages[@]}" -gt 0 ]; then
            sudo apt-get update
            sudo apt-get install --yes "${missing_packages[@]}"
          else
            echo "All Pebble SDK system libraries are already installed."
          fi

      - name: Cache Pebble SDK
        uses: actions/cache@v5
        with:
          path: ~/.local/share/pebble-sdk
          key: ${{ runner.os }}-${{ runner.arch }}-pebble-sdk-${{ env.PEBBLE_SDK_VERSION }}

      - name: Set up Pebble build tools and SDK
        run: |
          if [ ! -x .venv/bin/pebble ]; then
            python -m venv .venv
            .venv/bin/python -m pip install --upgrade pip
            .venv/bin/python -m pip install pebble-tool==5.0.40
          fi
          SDK_DATA_DIR="${XDG_DATA_HOME:-$HOME/.local/share}"
          if [ -d "$HOME/.pebble-sdk" ]; then
            SDK_DATA_DIR="$HOME/.pebble-sdk"
          fi
          SDK_PATH="$SDK_DATA_DIR/pebble-sdk/SDKs/$PEBBLE_SDK_VERSION"
          if [ -f "$SDK_PATH/sdk-core/manifest.json" ]; then
            .venv/bin/pebble sdk activate "$PEBBLE_SDK_VERSION"
          else
            .venv/bin/pebble sdk install "$PEBBLE_SDK_VERSION"
          fi

      - name: Set automatic release version
        id: release_version
        if: inputs.publish_release
        run: |
          VERSION_PREFIX="$(node -p "require('./package.json').version" | sed 's/\.[^.]*$//')"
          RELEASE_VERSION="$VERSION_PREFIX.$(git rev-list --count "$GITHUB_SHA")"
          echo "version=$RELEASE_VERSION" >> "$GITHUB_OUTPUT"
          npm version "$RELEASE_VERSION" --no-git-tag-version --allow-same-version

      - name: Build Pebble app
        run: .venv/bin/pebble build

      - name: Prepare canonical Pebble build artifact
        if: inputs.publish_release
        env:
          RELEASE_VERSION: ${{ steps.release_version.outputs.version }}
        run: |
          PBW_PATH="$(find . -type f -name '*.pbw' \
            -not -path './.git/*' \
            -not -path './.venv/*' \
            -not -path './node_modules/*' \
            -print -quit)"
          if [ -z "$PBW_PATH" ]; then
            echo "Pebble build did not produce a PBW. Found these PBW files:"
            find . -type f -name '*.pbw' \
              -not -path './.git/*' \
              -not -path './.venv/*' \
              -not -path './node_modules/*' \
              -print
            exit 1
          fi
          cp "$PBW_PATH" build/pebble-release-input.pbw
          printf '%s\n' "$RELEASE_VERSION" > build/release-version.txt

      - name: Upload Pebble build outputs
        if: inputs.publish_release
        uses: actions/upload-artifact@v7
        with:
          name: pebble-build
          path: |
            build/pebble-release-input.pbw
            build/pebble-js-app.js.map
            build/release-version.txt
          if-no-files-found: error
