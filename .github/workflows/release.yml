name: Release

on:
  workflow_call: {}

permissions:
  contents: write

jobs:
  package_release:
    name: Package release artifacts
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - name: Check out source
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.13'

      - name: Download Pebble build outputs
        uses: actions/download-artifact@v7
        with:
          name: pebble-build
          path: build

      - name: Read release version
        run: |
          VERSION_PATH="$(find build -type f -name 'release-version.txt' -print -quit)"
          if [ -z "$VERSION_PATH" ]; then
            echo "Release version metadata is missing from the Pebble build artifact."
            find build -type f -print
            exit 1
          fi
          VERSION="$(cat "$VERSION_PATH")"
          if [ -z "$VERSION" ]; then
            echo "Release version metadata is empty."
            exit 1
          fi
          EXPECTED_VERSION="$(python tools/release-version.py)"
          if [ "$VERSION" != "$EXPECTED_VERSION" ]; then
            echo "Build version $VERSION does not match expected release version $EXPECTED_VERSION."
            exit 1
          fi
          echo "RELEASE_VERSION=$VERSION" >> "$GITHUB_ENV"

      - name: Package release artifacts
        run: |
          PBW_PATH="$(find build -type f -name 'pebble-release-input.pbw' -print -quit)"
          SOURCE_MAP_PATH="$(find build -type f -name 'pebble-js-app.js.map' -print -quit)"
          VERSION_PATH="$(find build -type f -name 'release-version.txt' -print -quit)"
          if [ -z "$PBW_PATH" ] || [ -z "$SOURCE_MAP_PATH" ] || [ -z "$VERSION_PATH" ]; then
            echo "Pebble build artifact is missing from the downloaded files:"
            find build -type f -print
            exit 1
          fi

          mkdir -p dist
          python tools/package-release.py "$PBW_PATH" dist/codex-limits.pbw
          cp "$SOURCE_MAP_PATH" dist/codex-limits.js.map
          cp dist/codex-limits.pbw "dist/ai-limits-$RELEASE_VERSION.pbw"
          cp dist/codex-limits.js.map "dist/ai-limits-$RELEASE_VERSION.js.map"
          cp "$VERSION_PATH" dist/release-version.txt
          (
            cd dist
            sha256sum "ai-limits-$RELEASE_VERSION.pbw" "ai-limits-$RELEASE_VERSION.js.map" > "ai-limits-$RELEASE_VERSION.sha256"
          )

      - name: Upload release artifacts
        uses: actions/upload-artifact@v7
        with:
          name: release-artifacts
          path: |
            dist/ai-limits-*
            dist/release-version.txt
          if-no-files-found: error

  publish_release:
    name: Publish GitHub Release
    needs: package_release
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - name: Check out repository history
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Download release artifacts
        uses: actions/download-artifact@v7
        with:
          name: release-artifacts
          path: dist

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION="$(cat dist/release-version.txt)"
          git fetch --tags origin '+refs/heads/main:refs/remotes/origin/main'
          if gh release view "v$VERSION" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            EXISTING_SHA="$(git rev-parse "v$VERSION^{commit}")"
            if git log -1 --format=%B "$EXISTING_SHA" | grep -Fxq "Release-Source: $GITHUB_SHA"; then
              echo "Release v$VERSION already exists for this commit; skipping duplicate publication."
              exit 0
            fi
            echo "Release v$VERSION belongs to another source commit ($EXISTING_SHA)."
            exit 1
          fi

          RELEASE_COMMIT="$(git log -1 --format=%H --grep="Release-Source: $GITHUB_SHA" origin/main)"
          if [ -n "$RELEASE_COMMIT" ]; then
            EXISTING_VERSION="$(git show "$RELEASE_COMMIT:package.json" | node -p "JSON.parse(require('fs').readFileSync(0, 'utf8')).version")"
            if [ "$EXISTING_VERSION" != "$VERSION" ]; then
              echo "Release commit $RELEASE_COMMIT has version $EXISTING_VERSION, expected $VERSION."
              exit 1
            fi
          else
            CURRENT_MAIN="$(git rev-parse origin/main)"
            if [ "$CURRENT_MAIN" != "$GITHUB_SHA" ]; then
              if ! git merge-base --is-ancestor "$GITHUB_SHA" "$CURRENT_MAIN"; then
                echo "Commit $GITHUB_SHA is no longer on main; skipping this release."
                exit 0
              fi
              while IFS= read -r changed; do
                case "$changed" in
                  src/*|wscript|package.json|package-lock.json|tools/package-release.py|tools/release-version.py|.github/workflows/*)
                    echo "Newer app input $changed superseded $GITHUB_SHA; skipping this release."
                    exit 0
                    ;;
                esac
              done < <(git diff --name-only "$GITHUB_SHA" "$CURRENT_MAIN")
            fi
            git checkout --detach origin/main
            npm version "$VERSION" --no-git-tag-version --allow-same-version --ignore-scripts
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git add package.json package-lock.json
            git commit --allow-empty -m "chore(release): v$VERSION" -m "Release-Source: $GITHUB_SHA"
            git push origin HEAD:main
            RELEASE_COMMIT="$(git rev-parse HEAD)"
          fi

          PREVIOUS_TAG="$(gh release list --limit 1 --json tagName --jq '.[0].tagName // empty')"
          if [ -n "$PREVIOUS_TAG" ]; then
            RANGE="$PREVIOUS_TAG..$RELEASE_COMMIT"
            gh api --method POST "repos/$GITHUB_REPOSITORY/releases/generate-notes" \
              --field tag_name="v$VERSION" \
              --field target_commitish="$RELEASE_COMMIT" \
              --field previous_tag_name="$PREVIOUS_TAG" \
              --jq .body > dist/generated-release-notes.md
          else
            RANGE="$RELEASE_COMMIT"
            gh api --method POST "repos/$GITHUB_REPOSITORY/releases/generate-notes" \
              --field tag_name="v$VERSION" \
              --field target_commitish="$RELEASE_COMMIT" \
              --jq .body > dist/generated-release-notes.md
          fi

          git log --reverse --format='- `%h` %s' "$RANGE" > dist/commits.md

          cat > dist/release-notes.md <<EOF
          ## AI Limits v$VERSION

          Built from source commit \`$GITHUB_SHA\` after the checks and seven-platform Pebble build passed. Version recorded in \`$RELEASE_COMMIT\`.

          ### Install

          Download the PBW, transfer it to your paired phone, then install it using the Pebble mobile app.

          ### Verify the downloads

          Download all three files into the same directory and run:

          \`\`\`sh
          sha256sum -c ai-limits-$VERSION.sha256
          \`\`\`

          ### Commits since ${PREVIOUS_TAG:-the beginning of repository history}
          EOF
          cat dist/commits.md >> dist/release-notes.md
          printf '\n### GitHub-generated release notes\n\n' >> dist/release-notes.md
          cat dist/generated-release-notes.md >> dist/release-notes.md

          gh release create "v$VERSION" \
            "dist/ai-limits-$VERSION.pbw" \
            "dist/ai-limits-$VERSION.js.map" \
            "dist/ai-limits-$VERSION.sha256" \
            --title "AI Limits $VERSION" \
            --notes-file dist/release-notes.md \
            --target "$RELEASE_COMMIT" \
            --repo "$GITHUB_REPOSITORY"
