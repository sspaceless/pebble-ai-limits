name: Release

on:
  workflow_call: {}

permissions:
  contents: write

jobs:
  package_release:
    name: Package release artifacts
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.13'

      - name: Download Pebble build outputs
        uses: actions/download-artifact@v7
        with:
          name: pebble-build
          path: build

      - name: Read release version
        run: |
          VERSION_PATH="$(find build -type f -name 'release-version.txt' -print -quit)"
          if [ -z "$VERSION_PATH" ]; then
            echo "Release version metadata is missing from the Pebble build artifact."
            find build -type f -print
            exit 1
          fi
          VERSION="$(cat "$VERSION_PATH")"
          if [ -z "$VERSION" ]; then
            echo "Release version metadata is empty."
            exit 1
          fi
          echo "RELEASE_VERSION=$VERSION" >> "$GITHUB_ENV"

      - name: Package release artifacts
        run: |
          PBW_PATH="$(find build -type f -name 'pebble-release-input.pbw' -print -quit)"
          SOURCE_MAP_PATH="$(find build -type f -name 'pebble-js-app.js.map' -print -quit)"
          VERSION_PATH="$(find build -type f -name 'release-version.txt' -print -quit)"
          if [ -z "$PBW_PATH" ] || [ -z "$SOURCE_MAP_PATH" ] || [ -z "$VERSION_PATH" ]; then
            echo "Pebble build artifact is missing from the downloaded files:"
            find build -type f -print
            exit 1
          fi

          mkdir -p dist
          python tools/package-release.py "$PBW_PATH" dist/codex-limits.pbw
          cp "$SOURCE_MAP_PATH" dist/codex-limits.js.map
          cp dist/codex-limits.pbw "dist/ai-limits-$RELEASE_VERSION.pbw"
          cp dist/codex-limits.js.map "dist/ai-limits-$RELEASE_VERSION.js.map"
          cp "$VERSION_PATH" dist/release-version.txt
          (
            cd dist
            sha256sum "ai-limits-$RELEASE_VERSION.pbw" "ai-limits-$RELEASE_VERSION.js.map" > "ai-limits-$RELEASE_VERSION.sha256"
          )

      - name: Upload release artifacts
        uses: actions/upload-artifact@v7
        with:
          name: release-artifacts
          path: |
            dist/ai-limits-*
            dist/release-version.txt
          if-no-files-found: error

  publish_release:
    name: Publish GitHub Release
    needs: package_release
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - name: Download release artifacts
        uses: actions/download-artifact@v7
        with:
          name: release-artifacts
          path: dist

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION="$(cat dist/release-version.txt)"
          if gh release view "v$VERSION" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "Release v$VERSION already exists; skipping duplicate publication."
            exit 0
          fi

          NOTES="$(cat <<EOF
          ## AI Limits v$VERSION

          Built from commit \`$GITHUB_SHA\` after the checks and seven-platform Pebble build passed.

          ### Included files

          - \`ai-limits-$VERSION.pbw\`: installable Pebble app for aplite, basalt, chalk, diorite, emery, flint, and gabbro.
          - \`ai-limits-$VERSION.js.map\`: JavaScript source map for debugging.
          - \`ai-limits-$VERSION.sha256\`: SHA-256 checksums for the PBW and source map.

          ### Install

          Download the PBW, transfer it to your paired phone, then install it using the Pebble mobile app.

          ### Verify the downloads

          Download all three files into the same directory and run:

          \`\`\`sh
          sha256sum -c ai-limits-$VERSION.sha256
          \`\`\`
          EOF
          )"

          gh release create "v$VERSION" \
            "dist/ai-limits-$VERSION.pbw" \
            "dist/ai-limits-$VERSION.js.map" \
            "dist/ai-limits-$VERSION.sha256" \
            --title "AI Limits $VERSION" \
            --notes "$NOTES" \
            --generate-notes \
            --target "$GITHUB_SHA" \
            --repo "$GITHUB_REPOSITORY"
