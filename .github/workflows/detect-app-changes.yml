name: Detect app build changes

on:
  workflow_call:
    outputs:
      app:
        description: Whether app build inputs changed.
        value: ${{ jobs.detect.outputs.app }}

permissions:
  contents: read

jobs:
  detect:
    name: Detect app build changes
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      pull-requests: read
    outputs:
      app: ${{ steps.filter.outputs.app }}
    steps:
      - name: Check out source
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Filter app build inputs
        uses: dorny/paths-filter@v4
        id: filter
        with:
          base: ${{ github.ref }}
          predicate-quantifier: 'some-with-excludes'
          filters: |
            app:
              - 'src/**'
              - 'wscript'
              - 'package.json'
              - 'package-lock.json'
              - 'tools/package-release.py'
              - 'tools/release-version.py'
              - '.github/workflows/**'
              - '!**/*.md'
